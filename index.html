<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prawo jazdy kat. B — egzamin teoretyczny</title>
<style>
:root{
  --bg:#0d0d0d;
  --surface:#161616;
  --surface-2:#1d1d1d;
  --line:#2b2b2b;
  --line-strong:#454545;
  --text:#f4f4f2;
  --muted:#9a9a96;
  --dim:#6d6d69;
  --invert-bg:#f4f4f2;
  --invert-fg:#0d0d0d;
  --display:"Bahnschrift","DIN Alternate","Roboto Condensed",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --plate-radius:3px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--invert-bg);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;letter-spacing:.01em}

/* ---------- chrome ---------- */
.topbar{background:#000;border-bottom:1px solid var(--line-strong)}
.topbar-in{
  max-width:1120px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--dim)}
.topbar-spacer{flex:1}
.langs{display:flex;gap:1px;background:var(--line);padding:1px;border-radius:2px}
.langs button{
  font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.08em;
  padding:6px 11px;border-radius:1px;color:var(--muted);background:#000;
}
.langs button:hover{color:var(--text)}
.langs button[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
.ghost{
  font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:7px 12px;border:1px solid var(--line-strong);border-radius:2px;color:var(--muted);
}
.ghost:hover{border-color:var(--invert-bg);color:var(--text)}

main{max-width:1120px;margin:0 auto;padding:26px 20px 60px}

/* ---------- plates ---------- */
.plate{background:var(--surface);border:1px solid var(--line);border-radius:var(--plate-radius)}
.eyebrow{
  font-family:var(--display);font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:stretch}
.hero-main{padding:34px 36px}
.hero-main h1{font-size:clamp(30px,4.2vw,46px);line-height:1.04}
.hero-main p{max-width:46ch;color:var(--muted);margin:14px 0 0}
.rule{height:1px;background:var(--line);margin:26px 0}
.startrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:13px 20px;border-radius:2px;border:1px solid transparent;font-size:14px;
}
.btn-primary{background:var(--invert-bg);color:var(--invert-fg);border-color:var(--invert-bg)}
.btn-primary:hover{background:#fff;border-color:#fff}
.btn-secondary{border-color:var(--line-strong);color:var(--text)}
.btn-secondary:hover{border-color:var(--invert-bg);background:var(--surface-2)}
.btn-quiet{border-color:var(--line);color:var(--muted)}
.btn-quiet:hover{border-color:var(--line-strong);color:var(--text)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

.facts{padding:28px 30px;display:flex;flex-direction:column;gap:0}
.fact{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact dt{color:var(--muted);font-size:14px}
.fact dd{margin:0;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.card{padding:24px 26px}
.card h3{font-size:17px;margin-bottom:8px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card .btn{margin-top:16px}

/* ---------- exam layout ---------- */
.examgrid{display:grid;grid-template-columns:1fr 236px;gap:18px;align-items:start}
.qplate{padding:0;overflow:hidden}
.qhead{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 22px;background:#000;border-bottom:1px solid var(--line);
}
.qnum{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{
  font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:1px;border:1px solid var(--line-strong);color:var(--muted);
}
.tag-basic{color:var(--text);border-color:var(--text)}
.tag-spec{background:var(--invert-bg);color:var(--invert-fg);border-color:var(--invert-bg)}
.tag-pts{color:var(--muted)}
.tag-warn{border-style:dashed}

.media{
  background:#000;display:flex;align-items:center;justify-content:center;
  min-height:220px;max-height:52vh;position:relative;border-bottom:1px solid var(--line);
}
.media video,.media img{display:block;max-width:100%;max-height:52vh;object-fit:contain}
.media-none{min-height:0;border-bottom:0}
.media-missing{
  color:var(--dim);font-family:var(--display);font-size:13px;letter-spacing:.08em;
  padding:44px 20px;text-align:center;text-transform:uppercase;
}
.media-missing code{color:var(--muted);font-size:12px;display:block;margin-top:8px;word-break:break-all;text-transform:none;letter-spacing:0}
.replay{
  position:absolute;right:12px;bottom:12px;
  background:rgba(13,13,13,.85);border:1px solid var(--line-strong);color:var(--text);
  font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;border-radius:2px;
}
.replay:hover{background:#000;border-color:var(--invert-bg)}

.qtext{padding:22px;font-size:19px;line-height:1.45}
.qsrc{padding:0 22px 14px;font-size:13px;color:var(--dim)}
.answers{padding:0 22px 22px;display:flex;flex-direction:column;gap:9px}
.answers-tn{flex-direction:row}
.ans{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  border:1px solid var(--line-strong);border-radius:2px;padding:14px 16px;background:var(--surface-2);
}
.ans:hover:not([disabled]){border-color:var(--invert-bg);background:#242424}
.ans .key{
  font-family:var(--display);font-weight:600;font-size:15px;
  min-width:26px;height:26px;border-radius:1px;border:1px solid var(--line-strong);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.answers-tn .ans{justify-content:center;text-align:center;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.05em;padding:20px}
.ans[aria-pressed="true"]{border-color:var(--invert-bg);background:var(--invert-bg);color:var(--invert-fg)}
.ans[aria-pressed="true"] .key{border-color:var(--invert-fg);color:var(--invert-fg)}
.ans.correct{border-color:var(--invert-bg);background:var(--invert-bg);color:var(--invert-fg)}
.ans.correct .key{border-color:var(--invert-fg);color:var(--invert-fg)}
.ans.correct::after{content:"✓";margin-left:auto;font-weight:700}
.ans.wrong{border-style:dashed;border-color:var(--dim);color:var(--dim);background:transparent}
.ans.wrong::after{content:"✕";margin-left:auto}
.ans[disabled]{cursor:default}

.qfoot{display:flex;gap:10px;padding:0 22px 22px;flex-wrap:wrap;align-items:center}
.qfoot .spacer{flex:1}
.note{font-size:13px;color:var(--muted)}

/* ---------- signature: speed-limit timer ---------- */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.timerbox{padding:20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.disc{
  --p:1;
  width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--ring,var(--invert-bg)) calc(var(--p) * 360deg), #242424 0);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.disc::after{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--surface)}
.disc-val{position:relative;z-index:1;text-align:center;line-height:1}
.disc-val b{display:block;font-family:var(--display);font-size:46px;font-weight:600;font-variant-numeric:tabular-nums}
.disc-val small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.disc.paused{--ring:var(--dim)}
.disc.read{--ring:var(--line-strong)}
.disc.low{--ring:var(--invert-bg)}
@media (prefers-reduced-motion: no-preference){
  .disc.low .disc-val b{animation:pulse 1s ease-in-out infinite}
}
@keyframes pulse{50%{opacity:.35}}

.sidestat{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--muted)}
.sidestat b{font-family:var(--display);color:var(--text);font-variant-numeric:tabular-nums}

/* ---------- progress ---------- */
.progress{padding:16px 18px}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pcell{
  aspect-ratio:1;border:1px solid var(--line);border-radius:1px;background:var(--surface-2);
  font-family:var(--display);font-size:11px;color:var(--dim);
  display:flex;align-items:center;justify-content:center;
}
.pcell:hover{border-color:var(--line-strong);color:var(--text)}
.pcell.done{background:var(--dim);border-color:var(--dim);color:#000}
.pcell.now{border-color:var(--invert-bg);color:var(--invert-fg);background:var(--invert-bg)}
.pcell.spec{border-bottom:3px solid var(--line-strong)}
.plegend{display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--dim);flex-wrap:wrap}

/* ---------- results ---------- */
.score{padding:32px 34px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.scorenum{text-align:center}
.scorenum b{display:block;font-family:var(--display);font-size:78px;font-weight:600;line-height:.9;font-variant-numeric:tabular-nums}
.scorenum small{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.verdict{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:.03em}
.verdict.pass{color:var(--text)}
.verdict.fail{color:var(--dim)}
.bar{height:10px;background:#242424;border-radius:1px;overflow:hidden;margin:14px 0 8px;position:relative}
.bar i{display:block;height:100%;background:var(--invert-bg)}
.bar .thr{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--text)}

.review{margin-top:18px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rhead .spacer{flex:1}
.ritem{padding:16px 18px;margin-bottom:8px;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:start}
.rmark{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:600;font-size:17px;flex:none;border:1px solid var(--line-strong);
}
.rmark.ok{background:var(--invert-bg);color:var(--invert-fg);border-color:var(--invert-bg)}
.rmark.no{color:var(--text);border-color:var(--text)}
.rmark.skip{color:var(--dim)}
.ritem p{margin:0 0 6px;font-size:15px}
.rmeta{font-size:13px;color:var(--muted)}
.rmeta b{color:var(--text)}
.rpts{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}

/* ---------- settings ---------- */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.modal-in{background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h2{font-size:19px;flex:1}
.modal-body{padding:8px 24px 20px}
.opt{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.opt:last-child{border-bottom:0}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:#fff;flex:none}
.opt label{font-size:15px;display:block}
.opt .note{margin-top:3px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

.warnbar{
  background:var(--surface-2);border:1px solid var(--line-strong);border-radius:2px;
  padding:12px 16px;margin-bottom:18px;font-size:14px;
}

.hidden{display:none !important}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .examgrid{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;flex-wrap:wrap}
  .timerbox{flex:1;min-width:200px}
  .progress{flex:2;min-width:260px}
  .score{grid-template-columns:1fr;gap:18px}
}
@media (max-width:560px){
  .answers-tn{flex-direction:column}
}
</style>
</head>

var STORE = "prawko.v2";

var bank = (window.KATALOG && window.KATALOG.questions) || [];

var state = {
  lang: "pl",
  screen: "home",
  settings: {
    pause: true, back: true, replay: true, auto: true, timer: true, unverified: false
  },
  history: [],
  exam: null,
  learn: null
};

/* ---------- storage ---------- */
function load() {
  try {
    var raw = localStorage.getItem(STORE);
    if (!raw) return;
    var d = JSON.parse(raw);
    if (d.lang && T[d.lang]) state.lang = d.lang;
    if (d.settings) for (var k in state.settings) if (k in d.settings) state.settings[k] = !!d.settings[k];
    if (Array.isArray(d.history)) state.history = d.history;
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      lang: state.lang, settings: state.settings, history: state.history
    }));
  } catch (e) {}
}

function t(key) { return T[state.lang][key] || T.pl[key] || key; }

/* ---------- helpers ---------- */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function mmss(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function pool() {
  return state.settings.unverified ? bank : bank.filter(function (q) { return q.verified; });
}

/* ---------- exam construction ---------- */
function drawExam() {
  var src = pool();
  var picked = [];
  var used = {};

  function take(scope, points, n) {
    var cand = src.filter(function (q) {
      return q.scope === scope && q.points === points && !used[q.id];
    });
    shuffle(cand);
    var got = cand.slice(0, n);
    got.forEach(function (q) { used[q.id] = 1; });
    if (got.length < n) {
      var fill = src.filter(function (q) { return q.scope === scope && !used[q.id]; });
      shuffle(fill);
      got = got.concat(fill.slice(0, n - got.length));
      got.forEach(function (q) { used[q.id] = 1; });
    }
    return got;
  }

  var basic = [];
  [3, 2, 1].forEach(function (p) { basic = basic.concat(take("P", p, RULES.basic.draw[p])); });
  var spec = [];
  [3, 2, 1].forEach(function (p) { spec = spec.concat(take("S", p, RULES.spec.draw[p])); });

  shuffle(basic); shuffle(spec);

  var items = basic.concat(spec).map(function (q) {
    var isBasic = q.scope === "P";
    return {
      q: q,
      phase: isBasic ? "read" : "answer",
      readLeft: isBasic ? RULES.basic.read : 0,
      ansLeft: isBasic ? RULES.basic.answer : RULES.spec.total,
      answer: null,
      locked: false,
      played: false
    };
  });

  return {
    items: items,
    index: 0,
    globalLeft: RULES.examSeconds,
    paused: false,
    finished: false,
    startedAt: Date.now()
  };
}

/* ---------- ticking ---------- */
var ticker = null;
function startTicker() {
  stopTicker();
  ticker = setInterval(tick, 250);
}
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

var lastTick = 0;
function tick() {
  var ex = state.exam;
  if (!ex || ex.finished || state.screen !== "exam") return;
  var now = Date.now();
  var dt = lastTick ? (now - lastTick) / 1000 : 0.25;
  lastTick = now;
  if (ex.paused || !state.settings.timer) { renderTimer(); return; }

  ex.globalLeft -= dt;
  if (ex.globalLeft <= 0) { ex.globalLeft = 0; finishExam(); return; }

  var it = ex.items[ex.index];
  if (it && !it.locked) {
    if (it.phase === "read") {
      it.readLeft -= dt;
      if (it.readLeft <= 0) { it.readLeft = 0; it.phase = "answer"; renderExam(); return; }
    } else {
      it.ansLeft -= dt;
      if (it.ansLeft <= 0) {
        it.ansLeft = 0;
        it.locked = true;
        advance();
        return;
      }
    }
  }
  renderTimer();
}

/* ---------- exam actions ---------- */
function advance() {
  var ex = state.exam;
  if (ex.index < ex.items.length - 1) { ex.index++; renderExam(); return; }
  var next = -1;
  for (var i = 0; i < ex.items.length; i++) {
    if (!ex.items[i].answer && !ex.items[i].locked) { next = i; break; }
  }
  if (next === -1) { renderExam(); return; }
  ex.index = next;
  renderExam();
}

function answerQuestion(value) {
  var ex = state.exam;
  var it = ex.items[ex.index];
  if (it.locked) return;
  var changed = it.answer !== value;
  it.answer = value;
  if (state.settings.auto && changed) advance();
  else renderExam();
}

function finishExam() {
  var ex = state.exam;
  if (ex.finished) return;
  ex.finished = true;
  ex.endedAt = Date.now();
  ex.items.forEach(function (it) { it.locked = true; });
  stopTicker();

  var res = scoreExam(ex);
  state.history.unshift({
    at: Date.now(),
    points: res.points,
    passed: res.passed,
    correct: res.correct,
    seconds: Math.round((ex.endedAt - ex.startedAt) / 1000)
  });
  state.history = state.history.slice(0, 30);
  save();
  state.screen = "result";
  render();
}

function scoreExam(ex) {
  var points = 0, correct = 0;
  ex.items.forEach(function (it) {
    if (it.answer && it.answer === it.q.correct) { points += it.q.points; correct++; }
  });
  return { points: points, correct: correct, passed: points >= RULES.passPoints };
}

/* ---------- media ---------- */
function mediaNode(q, wantReplay, onPlayed) {
  var wrap = el("div", "media");
  if (!q.media) { wrap.className = "media media-none"; return wrap; }

  function fail() { showMissing(wrap, q); }

  if (q.media.kind === "video") {
    var v = document.createElement("video");
    v.setAttribute("playsinline", "");
    v.preload = "auto";
    v.muted = true;
    v.addEventListener("error", fail);
    v.addEventListener("ended", function () { if (onPlayed) onPlayed(); });
    var stall = setTimeout(function () { if (v.readyState === 0) fail(); }, 10000);
    v.addEventListener("loadeddata", function () { clearTimeout(stall); });
    v.src = "media/" + q.media.src;
    wrap.appendChild(v);
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
    if (wantReplay) {
      var b = el("button", "replay", t("replay"));
      b.addEventListener("click", function () { v.currentTime = 0; v.play(); });
      wrap.appendChild(b);
    }
  } else {
    var img = document.createElement("img");
    img.alt = "";
    img.addEventListener("error", fail);
    img.src = "media/" + q.media.src;
    wrap.appendChild(img);
  }
  return wrap;
}

function showMissing(wrap, q) {
  clear(wrap);
  var box = el("div", "media-missing");
  box.appendChild(document.createTextNode(t("mediaMissing")));
  box.appendChild(el("div", null, t("mediaHint")));
  box.appendChild(el("code", null, q.media ? q.media.orig : ""));
  wrap.appendChild(box);
}

function renderExam() {

function examNode() {
  var ex = state.exam;
  var it = ex.items[ex.index];
  var q = it.q;
  var isBasic = q.scope === "P";

  var grid = el("div", "examgrid");

  var plate = el("div", "plate qplate");
  var head = el("div", "qhead");
  head.appendChild(el("div", "qnum", (ex.index + 1) + " / 32"));
  head.appendChild(el("span", "tag " + (isBasic ? "tag-basic" : "tag-spec"), isBasic ? t("part1") : t("part2")));
  head.appendChild(el("span", "tag tag-pts", q.points + " " + t("points")));
  if (!q.verified) head.appendChild(el("span", "tag tag-warn", "?"));
  plate.appendChild(head);

  var showReplay = state.settings.replay && q.media && q.media.kind === "video";
  plate.appendChild(mediaNode(q, showReplay));

  plate.appendChild(el("div", "qtext", q.q[state.lang] || q.q.pl));
  if (state.lang !== "pl") plate.appendChild(el("div", "qsrc", q.q.pl));

  var ans = el("div", "answers" + (q.kind === "tn" ? " answers-tn" : ""));
  if (q.kind === "tn") {
    [["T", t("yes")], ["N", t("no")]].forEach(function (pair) {
      ans.appendChild(answerButton(it, pair[0], pair[1], null));
    });
  } else {
    var opts = (q.opts && (q.opts[state.lang] || q.opts.pl)) || ["", "", ""];
    ["A", "B", "C"].forEach(function (letter, i) {
      ans.appendChild(answerButton(it, letter, opts[i], letter));
    });
  }
  plate.appendChild(ans);

  var foot = el("div", "qfoot");
  if (state.settings.back && ex.index > 0) {
    var prev = el("button", "btn btn-quiet", t("prev"));
    prev.addEventListener("click", function () { ex.index--; renderExam(); });
    foot.appendChild(prev);
  }
  if (!state.settings.auto || it.locked || !state.settings.timer) {
    var next = el("button", "btn btn-secondary", t("next"));
    next.addEventListener("click", function () {
      if (!it.locked && it.answer) it.locked = true;
      if (ex.index < ex.items.length - 1) { ex.index++; renderExam(); } else advance();
    });
    foot.appendChild(next);
  }

function answerButton(it, value, label, letter) {
  var b = el("button", "ans");
  if (letter) {
    b.appendChild(el("span", "key", letter));

  } else {
    b.appendChild(document.createTextNode(label));
  }
  b.setAttribute("aria-pressed", it.answer === value ? "true" : "false");
  if (it.locked && state.settings.timer) b.disabled = true;
  b.addEventListener("click", function () { answerQuestion(value); });
  return b;
}

function timerNode() {

  if (state.settings.pause && state.settings.timer) {
    var p = el("button", "btn btn-quiet", ex.paused ? t("unpause") : t("pause"));
    p.addEventListener("click", function () {
      ex.paused = !ex.paused;
      lastTick = 0;
      renderExam();
    });
    p.style.width = "100%";
    box.appendChild(p);
  }

  var s1 = el("div", "sidestat");
  s1.appendChild(el("span", null, t("globalLeft")));
  var g = el("b", null, mmss(ex.globalLeft));
  g.id = "gclock";
  s1.appendChild(g);

  var done = ex.items.filter(function (x) { return x.answer; }).length;
  var s2 = el("div", "sidestat");
  s2.appendChild(el("span", null, t("answered")));
  s2.appendChild(el("b", null, done + " / 32"));
  box.appendChild(s2);

  setTimeout(renderTimer, 0);
  return box;
}

function renderTimer() {
  var ex = state.exam;
  if (!ex) return;
  var disc = document.getElementById("disc");
  if (!disc) return;
  var it = ex.items[ex.index];
  var num = disc.querySelector("b");
  var lab = disc.querySelector("small");
  var gc = document.getElementById("gclock");
  if (gc) gc.textContent = mmss(ex.globalLeft);

  disc.classList.remove("paused", "low", "read");

  if (!state.settings.timer) {
    disc.style.setProperty("--p", 1);
    disc.classList.add("paused");
    num.textContent = "∞";
    lab.textContent = "";
    return;
  }

  var left, total, mode;
  if (it.phase === "read" && !it.locked) {
    left = it.readLeft; total = RULES.basic.read; mode = "read";
  } else {
    left = it.ansLeft;
    total = it.q.scope === "P" ? RULES.basic.answer : RULES.spec.total;
    mode = "answer";
  }
  if (it.locked) left = 0;

  disc.style.setProperty("--p", Math.max(0, Math.min(1, left / total)));
  num.textContent = String(Math.ceil(left));
  lab.textContent = ex.paused ? t("paused") : (mode === "read" ? t("read") : t("answer"));
  if (ex.paused) disc.classList.add("paused");
  else if (mode === "read") disc.classList.add("read");
  else if (left <= 5) disc.classList.add("low");
}

function progressNode() {
  var ex = state.exam;
  var box = el("div", "plate progress");
  var grid = el("div", "pgrid");
  ex.items.forEach(function (it, i) {
    var c = el("button", "pcell", String(i + 1));
    if (it.q.scope === "S") c.classList.add("spec");
    if (it.answer) c.classList.add("done");
    if (i === ex.index) c.classList.add("now");
    c.addEventListener("click", function () {
      if (!state.settings.back && i !== ex.index) return;
      ex.index = i;
      renderExam();
    });
    grid.appendChild(c);
  });
  box.appendChild(grid);
  var lg = el("div", "plegend");
  lg.appendChild(el("span", null, "▬ " + t("part2")));
  box.appendChild(lg);
  return box;
}

  var score = el("div", "plate score");
  var num = el("div", "scorenum");
  num.appendChild(el("b", null, String(res.points)));
  num.appendChild(el("small", null, t("ofPoints")));
  score.appendChild(num);

  var right = el("div");
  right.appendChild(el("div", "eyebrow", t("resultTitle")));
  right.appendChild(el("div", "verdict " + (res.passed ? "pass" : "fail"), res.passed ? t("passed") : t("failed")));
  var bar = el("div", "bar");
  var fill = el("i");
  fill.style.width = (res.points / RULES.maxPoints * 100) + "%";
  bar.appendChild(fill);
  var thr = el("div", "thr");
  thr.style.left = (RULES.passPoints / RULES.maxPoints * 100) + "%";
  bar.appendChild(thr);
  right.appendChild(bar);
  right.appendChild(el("div", "note", t("threshold") + " · " + res.correct + " / 32 · " + mmss(((ex.endedAt || Date.now()) - ex.startedAt) / 1000)));

  var row = el("div", "startrow");
  row.style.marginTop = "18px";

  var missed = ex.items.filter(function (it) { return it.answer !== it.q.correct; });
  if (missed.length) {
    var fix = el("button", "btn btn-primary", t("fixMistakes") + " (" + missed.length + ")");
    fix.addEventListener("click", function () {
      startLearn(missed.map(function (it) { return it.q; }));
    });
    row.appendChild(fix);
  }

  var again = el("button", "btn " + (missed.length ? "btn-secondary" : "btn-primary"), t("again"));
  again.addEventListener("click", function () {
    state.exam = drawExam();
    state.screen = "exam";
    lastTick = 0;
    startTicker();
    render();
  });
  row.appendChild(again);
  var home = el("button", "btn btn-quiet", t("home"));
  home.addEventListener("click", function () { state.exam = null; state.screen = "home"; render(); });
  row.appendChild(home);
  right.appendChild(row);
  score.appendChild(right);
  wrap.appendChild(score);

  var review = el("div", "review");
  var rh = el("div", "rhead");
  rh.appendChild(el("div", "eyebrow", t("reviewTitle")));
  rh.appendChild(el("div", "spacer"));
  [["all", t("reviewAll")], ["wrong", t("reviewWrong")]].forEach(function (pair) {
    var b = el("button", "btn " + (reviewFilter === pair[0] ? "btn-secondary" : "btn-quiet"), pair[1]);
    b.addEventListener("click", function () { reviewFilter = pair[0]; render(); });
    rh.appendChild(b);
  });
  review.appendChild(rh);

  ex.items.forEach(function (it, i) {
    var ok = it.answer === it.q.correct;
    if (reviewFilter === "wrong" && ok) return;
    var item = el("div", "plate ritem");
    var mark = el("div", "rmark " + (ok ? "ok" : (it.answer ? "no" : "skip")), ok ? "✓" : (it.answer ? "✕" : "–"));
    item.appendChild(mark);

    var mid = el("div");
    mid.appendChild(el("p", null, (i + 1) + ". " + (it.q.q[state.lang] || it.q.q.pl)));
    var meta = el("div", "rmeta");
    meta.appendChild(document.createTextNode(t("yourAnswer") + ": "));
    meta.appendChild(el("b", null, it.answer ? labelFor(it.q, it.answer) : t("noAnswer")));
    if (!ok) {
      meta.appendChild(document.createTextNode(" · " + t("correctAnswer") + ": "));
      meta.appendChild(el("b", null, labelFor(it.q, it.q.correct)));
    }
    mid.appendChild(meta);
    item.appendChild(mid);

    item.appendChild(el("div", "rpts", (ok ? it.q.points : 0) + " / " + it.q.points));
    review.appendChild(item);
  });

  wrap.appendChild(review);
  return wrap;
}

function labelFor(q, value) {
  if (q.kind === "tn") return value === "T" ? t("yes") : t("no");
  var opts = (q.opts && (q.opts[state.lang] || q.opts.pl)) || [];
  var idx = { A: 0, B: 1, C: 2 }[value];
  return value + ". " + (opts[idx] || "");
}

/* ---------- learn mode ---------- */
function startLearn(fixedList) {
  state.learn = {
    scope: "all",
    media: "any",
    list: [],
    index: 0,
    answer: null,
    fixed: !!fixedList
  };
  if (fixedList) {
    state.learn.list = fixedList.slice();
  } else {
    rebuildLearn();
  }
  state.screen = "learn";
  stopTicker();
  render();
}

function rebuildLearn() {
  var L = state.learn;
  if (L.fixed) { L.index = 0; L.answer = null; return; }
  var list = pool().filter(function (q) {
    if (L.scope === "P" && q.scope !== "P") return false;
    if (L.scope === "S" && q.scope !== "S") return false;
    if (L.media === "video" && !(q.media && q.media.kind === "video")) return false;
    if (L.media === "image" && !(q.media && q.media.kind === "image")) return false;
    if (L.media === "none" && q.media) return false;
    return true;
  });
  L.list = shuffle(list.slice());
  L.index = 0;
  L.answer = null;
}

function renderLearn() {
  var L = state.learn;
  var wrap = el("div");

  var bar = el("div", "plate card");
  bar.style.display = "flex";
  bar.style.gap = "14px";
  bar.style.flexWrap = "wrap";
  bar.style.alignItems = "center";
  bar.appendChild(el("div", "eyebrow", L.fixed ? t("fixMistakes") : t("learnTitle")));

  if (!L.fixed) {
    bar.appendChild(select(t("filterScope"), [
      ["all", t("filterAll")], ["P", t("part1")], ["S", t("part2")]
    ], L.scope, function (v) { L.scope = v; rebuildLearn(); render(); }));

    bar.appendChild(select(t("filterMedia"), [
      ["any", t("anyMedia")], ["video", t("onlyVideo")], ["image", t("onlyImage")], ["none", t("onlyText")]
    ], L.media, function (v) { L.media = v; rebuildLearn(); render(); }));

    var sh = el("button", "btn btn-quiet", t("shuffle"));
    sh.addEventListener("click", function () { rebuildLearn(); render(); });
    bar.appendChild(sh);
  }

  if (L.fixed && state.exam) {
    var back = el("button", "btn btn-quiet", t("backToResult"));
    back.addEventListener("click", function () { state.screen = "result"; render(); });
    bar.appendChild(back);
  }

  var home = el("button", "btn btn-quiet", t("home"));
  home.addEventListener("click", function () { state.screen = "home"; render(); });
  bar.appendChild(home);
  wrap.appendChild(bar);

  if (!L.list.length) return wrap;

  var q = L.list[L.index];
  var plate = el("div", "plate qplate");
  plate.style.marginTop = "16px";

  var head = el("div", "qhead");
  head.appendChild(el("div", "qnum", (L.index + 1) + " " + t("ofTotal") + " " + L.list.length));
  head.appendChild(el("span", "tag " + (q.scope === "P" ? "tag-basic" : "tag-spec"), q.scope === "P" ? t("part1") : t("part2")));
  head.appendChild(el("span", "tag tag-pts", q.points + " " + t("points")));
  head.appendChild(el("span", "tag tag-pts", "#" + q.id));
  plate.appendChild(head);

  plate.appendChild(mediaNode(q, true));
  plate.appendChild(el("div", "qtext", q.q[state.lang] || q.q.pl));
  if (state.lang !== "pl") plate.appendChild(el("div", "qsrc", q.q.pl));

  var ans = el("div", "answers" + (q.kind === "tn" ? " answers-tn" : ""));
  function mk(value, label, letter) {
    var b = el("button", "ans");
    if (letter) {
      b.appendChild(el("span", "key", letter));
      b.appendChild(el("span", null, label));
    } else {
      b.appendChild(document.createTextNode(label));
    }
    if (L.answer) {
      b.disabled = true;
      if (value === q.correct) b.classList.add("correct");
      else if (value === L.answer) b.classList.add("wrong");
    }
    b.addEventListener("click", function () {
      if (L.answer) return;
      L.answer = value;
      render();
    });
    return b;
  }
  if (q.kind === "tn") {
    ans.appendChild(mk("T", t("yes"), null));
    ans.appendChild(mk("N", t("no"), null));
  } else {
    var opts = (q.opts && (q.opts[state.lang] || q.opts.pl)) || ["", "", ""];
    ["A", "B", "C"].forEach(function (letter, i) { ans.appendChild(mk(letter, opts[i], letter)); });
  }
  plate.appendChild(ans);

  var foot = el("div", "qfoot");
  if (L.answer) {
    var ok = L.answer === q.correct;
    var verdict = el("div", "note", ok ? t("goodJob") : t("tryAgain") + " " + t("correctIs") + " " + labelFor(q, q.correct));
    verdict.style.color = ok ? "var(--green)" : "var(--red)";
    verdict.style.fontWeight = "600";
    foot.appendChild(verdict);
  }
  foot.appendChild(el("div", "spacer"));
  var prev = el("button", "btn btn-quiet", t("prev"));
  prev.disabled = L.index === 0;
  prev.addEventListener("click", function () { L.index--; L.answer = null; render(); });
  foot.appendChild(prev);
  var next = el("button", "btn btn-secondary", t("next"));
  next.disabled = L.index >= L.list.length - 1;
  next.addEventListener("click", function () { L.index++; L.answer = null; render(); });
  foot.appendChild(next);
  plate.appendChild(foot);

  wrap.appendChild(plate);
  return wrap;
}

function select(label, options, value, onChange) {
  var w = el("label");
  w.style.display = "flex";
  w.style.alignItems = "center";
  w.style.gap = "8px";
  w.style.fontSize = "14px";
  w.appendChild(el("span", null, label));
  var s = document.createElement("select");
  s.style.font = "inherit";
  s.style.padding = "8px 10px";
  s.style.border = "1px solid var(--line)";
  s.style.borderRadius = "3px";
  s.style.background = "#fff";
  options.forEach(function (pair) {
    var o = document.createElement("option");
    o.value = pair[0];
    o.textContent = pair[1];
    if (pair[0] === value) o.selected = true;
    s.appendChild(o);
  });
  s.addEventListener("change", function () { onChange(s.value); });
  w.appendChild(s);
  return w;
}

/* ---------- settings modal ---------- */
function renderSettings() {
  var modal = document.getElementById("settings-modal");
  document.getElementById("set-title").textContent = t("setTitle");
  document.getElementById("set-close").textContent = t("setClose");
  var body = document.getElementById("set-body");
  clear(body);
  [
    ["timer", "optTimer", "optTimerNote"],
    ["pause", "optPause", "optPauseNote"],
    ["back", "optBack", "optBackNote"],
    ["replay", "optReplay", "optReplayNote"],
    ["auto", "optAuto", "optAutoNote"],
    ["unverified", "optUnverified", "optUnverifiedNote"]
  ].forEach(function (row) {
    var d = el("div", "opt");
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = state.settings[row[0]];
    cb.id = "opt-" + row[0];
    cb.addEventListener("change", function () {
      state.settings[row[0]] = cb.checked;
      save();
      if (state.screen === "exam") renderExam();
      else if (state.screen === "learn") { rebuildLearn(); render(); }
      else render();
    });
    d.appendChild(cb);
    var lw = el("div");
    var lb = el("label", null, t(row[1]));
    lb.setAttribute("for", cb.id);
    lw.appendChild(lb);
    lw.appendChild(el("div", "note", t(row[2])));
    d.appendChild(lw);
    body.appendChild(d);
  });
  modal.classList.remove("hidden");
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function (e) {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  var k = e.key.toLowerCase();

  if (state.screen === "exam" && state.exam && !state.exam.finished) {
    var it = state.exam.items[state.exam.index];
    if (k === " ") {
      e.preventDefault();
      if (state.settings.pause && state.settings.timer) {
        state.exam.paused = !state.exam.paused;
        lastTick = 0;
        renderExam();
      }
      return;
    }
    if (it.q.kind === "tn") {
      if (k === "t" || k === "y" || k === "1") { answerQuestion("T"); return; }
      if (k === "n" || k === "2") { answerQuestion("N"); return; }
    } else {
      if (k === "a" || k === "1") { answerQuestion("A"); return; }
      if (k === "b" || k === "2") { answerQuestion("B"); return; }
      if (k === "c" || k === "3") { answerQuestion("C"); return; }
    }
    if (e.key === "ArrowLeft" && state.settings.back && state.exam.index > 0) {
      state.exam.index--; renderExam(); return;
    }
    if (e.key === "ArrowRight" && state.exam.index < state.exam.items.length - 1) {
      state.exam.index++; renderExam(); return;
    }
  }

  if (state.screen === "learn" && state.learn) {
    var L = state.learn;
    var q = L.list[L.index];
    if (!q) return;
    if (!L.answer) {
      if (q.kind === "tn") {
        if (k === "t" || k === "1") { L.answer = "T"; render(); return; }
        if (k === "n" || k === "2") { L.answer = "N"; render(); return; }
      } else {
        if (k === "a" || k === "1") { L.answer = "A"; render(); return; }
        if (k === "b" || k === "2") { L.answer = "B"; render(); return; }
        if (k === "c" || k === "3") { L.answer = "C"; render(); return; }
      }
    }
    if (e.key === "ArrowRight" && L.index < L.list.length - 1) { L.index++; L.answer = null; render(); return; }
    if (e.key === "ArrowLeft" && L.index > 0) { L.index--; L.answer = null; render(); return; }
  }
});

/* ---------- boot ---------- */
document.getElementById("btn-settings").addEventListener("click", renderSettings);
document.getElementById("set-close").addEventListener("click", function () {
  document.getElementById("settings-modal").classList.add("hidden");
});
document.getElementById("settings-modal").addEventListener("click", function (e) {
  if (e.target === this) this.classList.add("hidden");
});
document.getElementById("btn-quit").addEventListener("click", function () {
  if (!confirm(t("quitConfirm"))) return;
  stopTicker();
  state.exam = null;
  state.screen = "home";
  render();
});

function render() {
  renderChrome();
  clear(app);
  if (state.screen === "exam" && state.exam && !state.exam.finished) {
    app.appendChild(examNode());
  } else if (state.screen === "result" && state.exam) {
    app.appendChild(renderResult());
  } else if (state.screen === "learn") {
    app.appendChild(renderLearn());
  } else {
    state.screen = "home";
    app.appendChild(renderHome());
  }
}

load();
document.documentElement.lang = state.lang === "ua" ? "uk" : state.lang;

if (!bank.length) {
  app.appendChild(el("div", "warnbar", "data/questions.js nie został wczytany. Uruchom tools/build_questions.py."));
} else {
  render();
}
})();
</script>
</body>
